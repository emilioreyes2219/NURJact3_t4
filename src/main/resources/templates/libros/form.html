<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h2 th:text="${libro.id == null ? 'Registrar Nuevo Libro' : 'Actualizar Libro'}"></h2>

    <form th:action="@{/libros/guardar}" th:object="${libro}" method="post" class="mt-3">
        
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Título del Libro</label>
            <input type="text" th:field="*{titulo}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">ISBN</label>
            <input type="text" th:field="*{isbn}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" th:field="*{precio}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Autor Asociado</label>
            <select th:field="*{autor.id}" class="form-select" required>
                <option value="">-- Selecciona un Autor --</option>
                <option th:each="autor : ${autores}" 
                        th:value="${autor.id}" 
                        th:text="${autor.nombre}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/libros}" class="btn btn-secondary">Cancelar</a>

    </form>

</body>
</html>
