<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Libros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Gestión de Libros y Autores</h2>
        <div>
            <a th:href="@{/libros/nuevo}" class="btn btn-primary">+ Nuevo Libro</a>
        </div>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>ISBN</th>
                <th>Precio</th>
                <th>Autor</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="libro : ${libros}">
                <td th:text="${libro.id}"></td>
                <td th:text="${libro.titulo}"></td>
                <td th:text="${libro.isbn}"></td>
                <td th:text="${'$' + libro.precio}"></td>
                <td th:text="${libro.autor != null ? libro.autor.nombre : 'Sin Autor'}" class="fw-bold text-success"></td>
                <td>
                    <a th:href="@{/libros/editar/{id}(id=${libro.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/libros/eliminar/{id}(id=${libro.id})}" 
                       onclick="return confirm('¿Estás seguro de eliminar este libro?')" 
                       class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(libros)}">
                <td colspan="6" class="text-center text-muted">No hay libros registrados todavía.</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
